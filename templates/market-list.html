{% extends 'base.html' %}
{% block content %}
<div class="col-span-2 row-span-2 relative overflow-x-auto">
    <table class="border-r border-gray-200 w-full text-sm text-left text-gray-500 dark:text-gray-400">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
            <tr>
                <th scope="col" class="px-6 py-3">
                    Name
                </th>
                <th scope="col" class="px-6 py-3">
                    Balance
                </th>
                <th scope="col" class="px-6 py-3">
                    Equity
                </th>
            </tr>
        </thead>
        <tbody>
            {% for market in markets %}
            <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-200    ">
                <td class="font-medium text-gray-900 whitespace-nowrap dark:text-white sm:p-5 p-3">
                    <a href="{% url 'market-detail' pk=market.id %}">{{ market.exchange_name }} ({{ market.friendly_name }})</a>
                </td>
                <td class="sm:p-5 p-3">
                    <a href="{% url 'market-detail' pk=market.id %}">$ {{ market.usdt|floatformat:2|default:'-' }}</a>
                </td>
                <td class="sm:p-5 p-3">
                    <a href="{% url 'market-detail' pk=market.id %}">$ {{ market.equity|floatformat:2|default:'-'}}</a>
                </td>
            </tr>
            </a>
            {% empty %}
            <tr class="bg-white border-b border-t dark:bg-gray-800 dark:border-gray-700">
                <td class="hyphens-auto px-6 py-4 whitespace-nowrap">
                    No markets yet.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
