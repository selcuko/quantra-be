{% extends 'base.html' %}

{% block content %}

<section class="p-5">

    <h2 class="text-4xl font-extrabold dark:text-white">
        <small class="font-semibold text-gray-500 dark:text-gray-400">Notification details:</small>
        <br>
        {{ notification.subject }}
        {% if notification.severity == 'CRITICAL' %}
        <span class="bg-red-100 text-red-800 text-2xl me-2 px-2.5 py-0.5 rounded">CRITICAL</span>
        {% elif notification.severity == 'ERROR' %}
        <span class="bg-yellow-100 text-yellow-800 me-2 px-2.5 py-0.5 rounded">IMPORTANT</span>
        {% endif %}
    </h2>
    <pre class="my-4 text-lg text-gray-500 text-wrap">{{ notification.message }}</pre>
    <pre class="mb-4 text-lg font-normal text-gray-500 dark:text-gray-400">{{ notification.details }}</pre>

</section>


{% endblock %}
