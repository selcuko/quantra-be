{% extends 'base.html' %}
{% block title %}Unified Orderbook{% endblock %}
{% block content %}
<div class="flex flex-row items-center justify-between">
  <h1 class="m-4 text-3xl font-extrabold leading-none tracking-tight text-gray-900 md:text-3xl lg:text-4xl">
      Unified
      <span class="underline underline-offset-3 decoration-8 decoration-blue-400 dark:decoration-blue-600">
          Orderbook
      </span>
  </h1>
</div>

<section class="p-4 flex flex-col">
  <form action="">
    <input type="text" placeholder="Symbol name" id="symbol" name="symbol">
    <input type="text" placeholder="Markets (Bybit, Gate)" name="markets" id="markets">
    <input type="submit" value="Submit">
  </form>
</section>

<script>
  const form = document.querySelector('form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const symbol = document.querySelector('#symbol').value;
    const markets = document.querySelector('#markets').value;
    window.location.href = `/orderbook/?symbol=${symbol}&market=${markets}`;
  });
</script>
{% endblock %}
