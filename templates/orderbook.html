{% extends 'base.html' %}
{% block title %}Unified Orderbook{% endblock %}
{% block content %}
<style>
    body {
        font-family: 'Inter', sans-serif;
        overflow: hidden;
    }
    .autocomplete {
        /*the container must be positioned relative:*/
        position: relative;
        display: inline-block;
      }
      input {
        border: 1px solid transparent;
        background-color: #f1f1f1;
        padding: 10px;
        font-size: 16px;
      }
      input[type=text] {
        background-color: #f1f1f1;
        width: 100%;
      }
      input[type=submit] {
        background-color: DodgerBlue;
        color: #fff;
      }
      .autocomplete-items {
        position: absolute;
        border: 1px solid #d4d4d4;
        border-bottom: none;
        border-top: none;
        z-index: 99;
        /*position the autocomplete items to be the same width as the container:*/
        top: 100%;
        left: 0;
        right: 0;
      }
      .autocomplete-items div {
        padding: 10px;
        cursor: pointer;
        background-color: #fff;
        border-bottom: 1px solid #d4d4d4;
      }
      .autocomplete-items div:hover {
        /*when hovering an item:*/
        background-color: #e9e9e9;
      }
      .autocomplete-active {
        /*when navigating through the items using the arrow keys:*/
        background-color: DodgerBlue !important;
        color: #ffffff;
      }
      
</style>
<div class="flex flex-row items-center justify-between">
    <h1 class="m-4 text-3xl font-extrabold leading-none tracking-tight text-gray-900 md:text-3xl lg:text-4xl">
        <span class="underline underline-offset-3 decoration-8 decoration-blue-400 dark:decoration-blue-600">
            Unified
        </span>
        Orderbook
    </h1>
</div>


<section class="p-4 h-screen overflow-hidden">
    <form autocomplete="off" action="/action_page.php">
        <div class="autocomplete" style="width:300px;">
          <input id="symbol-search" type="text" name="Symbol" placeholder="Symbol">
        </div>
      </form>
    <form action="">
        <label for="">Bybit</label>
        <input type="checkbox" value="BYBIT" id="market-bybit">
        <label for="">OKX</label>
        <input type="checkbox" value="OKX" id="market-okx">
    </form>
    <div id="orderbook" class="h-full">
        <div id="bids" class="h-[40vh] overflow-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Price</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr id="bids-rows">

                    </tr>
            </table>
        </div>
        <div id="asks" class="h-[40vh] overflow-y-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Price</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr id="asks-rows">
                    </tr>
            </table>
        </div>
    </div>
</section>

<script>
    const bids = document.getElementById('bids');
    const asks = document.getElementById('asks');
    const bidsRows = document.getElementById('bids-rows');
    const asksRows = document.getElementById('asks-rows');
    const marketBybit = document.getElementById('market-bybit');
    const marketOkx = document.getElementById('market-okx');
    let symbols = ['name1', 'name2', 'lastname'];
    let loadingSymbols = false;
    let selectedSymbol;
    const markets = [marketBybit, marketOkx];
    ws = new WebSocket("ws://localhost:8765");
    ws.onopen = function() {
        console.log("Connected to websocket server");
    };
    ws.onmessage = function(e) {
        const data = JSON.parse(e.data);
        console.log('DATA', data);
        if (1) {
            const { bids, asks } = data;
            console.log('BIDS', bids);
            console.log('ASKS', asks);
            bidsRows.innerHTML = '';
            asksRows.innerHTML = '';
            bids.forEach(bid => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${bid.price}</td>
                    <td>${bid.size}</td>
                `;
                bidsRows.appendChild(row);
            });
            bidsRows.scrollTop = bidsRows.scrollHeight;
            asks.forEach(ask => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${ask.price}</td>
                    <td>${ask.size}</td>
                `;
                asksRows.appendChild(row);
            });
        }
    };

    markets.forEach(market => {
        market.addEventListener('change', function(e) {
            if (!market.checked) return;
            console.log('MARKET', e.target.value);
            if (!selectedSymbol) {
                console.log('No symbol selected');
                return;
            }
            ws.send(JSON.stringify({
                'channel': 'subscribe',
                'market': e.target.value,
                'symbol': selectedSymbol,
            }));
        });
    });
</script>

<script>
    function sleep (time) {
        return new Promise((resolve) => setTimeout(resolve, time));
      }
    function autocomplete(inp) {
        /*the autocomplete function takes two arguments,
        the text field element and an array of possible autocompleted values:*/
        var currentFocus;
        /*execute a function when someone writes in the text field:*/
        inp.addEventListener("input", function(e) {
            // wait for symbols to load

            fetch('/symbols/search/?q=' + symsearch.value.toUpperCase())
            .then(response => response.json())
            .then(data => {
                console.log('Loading symbols');
                symbols = data.symbols;
            });
            var a, b, i, val = this.value;
            /*close any already open lists of autocompleted values*/
            closeAllLists();
            if (!val) { return false;}
            currentFocus = -1;
            /*create a DIV element that will contain the items (values):*/
            a = document.createElement("DIV");
            a.setAttribute("id", this.id + "autocomplete-list");
            a.setAttribute("class", "autocomplete-items");
            /*append the DIV element as a child of the autocomplete container:*/
            this.parentNode.appendChild(a);
            /*for each item in the array...*/
            for (i = 0; i < symbols.length; i++) {
              /*check if the item starts with the same letters as the text field value:*/
              if (symbols[i].substr(0, val.length).toUpperCase() == val.toUpperCase()) {
                /*create a DIV element for each matching element:*/
                b = document.createElement("DIV");
                /*make the matching letters bold:*/
                b.innerHTML = "<strong>" + symbols[i].substr(0, val.length) + "</strong>";
                b.innerHTML += symbols[i].substr(val.length);
                /*insert a input field that will hold the current array item's value:*/
                b.innerHTML += "<input type='hidden' value='" + symbols[i] + "'>";
                /*execute a function when someone clicks on the item value (DIV element):*/
                    b.addEventListener("click", function(e) {
                    /*insert the value for the autocomplete text field:*/
                    inp.value = this.getElementsByTagName("input")[0].value;
                    /*close the list of autocompleted values,
                    (or any other open lists of autocompleted values:*/
                    closeAllLists();
                    console.log('SELECT', inp.value);
                    selectedSymbol = inp.value;
                });
                a.appendChild(b);
              }
            }
        });
        /*execute a function presses a key on the keyboard:*/
        inp.addEventListener("keydown", function(e) {
            var x = document.getElementById(this.id + "autocomplete-list");
            if (x) x = x.getElementsByTagName("div");
            if (e.keyCode == 40) {
              /*If the arrow DOWN key is pressed,
              increase the currentFocus variable:*/
              currentFocus++;
              /*and and make the current item more visible:*/
              addActive(x);
            } else if (e.keyCode == 38) { //up
              /*If the arrow UP key is pressed,
              decrease the currentFocus variable:*/
              currentFocus--;
              /*and and make the current item more visible:*/
              addActive(x);
            } else if (e.keyCode == 13) {
              /*If the ENTER key is pressed, prevent the form from being submitted,*/
              e.preventDefault();
              if (currentFocus > -1) {
                /*and simulate a click on the "active" item:*/
                    //selectedSymbol = [currentFocus].get('input').value;
                if (x) x[currentFocus].click();
              }
            }
        });
        function addActive(x) {
            console.log('ACTIVE')
          /*a function to classify an item as "active":*/
          if (!x) return false;
          /*start by removing the "active" class on all items:*/
          removeActive(x);
          if (currentFocus >= x.length) currentFocus = 0;
          if (currentFocus < 0) currentFocus = (x.length - 1);
          /*add class "autocomplete-active":*/
          x[currentFocus].classList.add("autocomplete-active");
        }
        function removeActive(x) {
            console.log('INACTIVE')
          /*a function to remove the "active" class from all autocomplete items:*/
          for (var i = 0; i < x.length; i++) {
            x[i].classList.remove("autocomplete-active");
          }
        }
        function closeAllLists(elmnt) {
          /*close all autocomplete lists in the document,
          except the one passed as an argument:*/
          var x = document.getElementsByClassName("autocomplete-items");
          for (var i = 0; i < x.length; i++) {
            if (elmnt != x[i] && elmnt != inp) {
            x[i].parentNode.removeChild(x[i]);
          }
        }
      }
      /*execute a function when someone clicks in the document:*/
      document.addEventListener("click", function (e) {
          closeAllLists(e.target);
      });
      }
      const symsearch = document.getElementById('symbol-search');
      autocomplete(symsearch, symbols);

      symsearch.addEventListener('input', function(e) {
      });
</script>

{% endblock %}
