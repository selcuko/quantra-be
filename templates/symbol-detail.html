{% extends 'base.html' %}
{% block title %}{{ symbol.name }}{% endblock %}
{% block content %}

<div class="m-3 p-3 flex flex-col">
    <h1 class="flex items-center text-4xl font-extrabold dark:text-white">
        {{ symbol.base }} @ {{ symbol.market.exchange_name }}
    </h1>
</div>

<div class="m-3">
    <div class="flow-root rounded-lg border border-gray-300 p-3 shadow-sm">
        <dl class="-my-3 divide-y divide-gray-100 text-sm">
            <div class="grid grid-cols-1 gap-1 p-3 sm:grid-cols-3 sm:gap-4">
                <dt class="font-medium text-gray-900">Total volume</dt>
                <dd class="text-gray-700 sm:col-span-2">$ {{ metrics.volume }}</dd>
            </div>
            
        </dl>
    </div>
</div>


{% endblock %}
