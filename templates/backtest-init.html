{% extends 'base.html' %}
{% block content %}
<section class="p-4">
  <h1 class="mb-4 text-4xl font-extrabold leading-none tracking-tight text-gray-900 md:text-5xl lg:text-6xl dark:text-white">
    Do a
    <span class="underline underline-offset-3 decoration-8 decoration-blue-400 dark:decoration-blue-600">
      backtest
    </span>
  </h1>
  <form method="POST" action="">
        {% csrf_token %}
        <label for="market">Market</label>
          <select
          id="market"
          name="market"
          class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
          required>
          <option value="" disabled selected>Select a market</option>
          {% for market in markets %}
            <option value="{{ market }}">{{ market }}</option>
          {% endfor %}
        </select>
        <div>
          <label for="symbol">Symbol</label>
          <input type="text" placeholder="Symbol (BASE-QUOTE)" name="symbol" id="" class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
        </div>
        <div>
          <label for="type">Candle freq</label>
          <select name="freq" id="freq" class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
          >
            <option value="" disabled selected>Select a frequency</option>
            <option value="1 min">1 minute</option>
            <option value="5 min">5 minute</option>
            <option value="15 min" selected>15 minute</option>
            <option value="1 hour">1 hour</option>
            <option value="4 hour">4 hours</option>
          </select>
        </div>
        <div>
          <label for="type">Session type</label>
          <select disabled name="type" id="type" class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
          >
            <option value="" disabled selected>Backtest</option>
          </select>
        </div>
        <div>
          <label for="capital">Starting capital (in quote currency)</label>
          <input type="number" placeholder="Capital limit" name="capital" value="1000" id="" class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" >
        </div>
        <div>
          <label for="assets">Starting asset qty (in base qurrency)</label>
          <input type="number" placeholder="Asset limit" name="assets" value= "0" id="" class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" >
        </div>
        <div>
          <label for="start">Start time</label>
          <input required value="Leave empty to test to date" type="date" placeholder="Optional shutdown date" name="start" id="startTimeInput" class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" >
        </div>
        <div>
          <label for="shutdown">End time (optional)</label>
          <input type="date" placeholder="Optional shutdown date" name="end" id="shutdownDateInput" class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" >
        </div>
        <div>
          <label for="candle_type">Candle type</label>
          <select name="candle_type" id="type" class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
          >
            <option value="standard" selected>Standard</option>
            <option value="heikin_ashi">Heikin Ashi</option>
          </select>
        </div>
        <div>
          <label for="source">Source</label>
          <select name="source" id="type" class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
            <option value="close" selected>close</option>
            <option value="ohlc4">OHLC4</option>
            <option value="volume">Volume</option>
            <option value="volume_ma">Volume MA</option>
          </select>
        </div>
        <div>
          <label for="stoch_length">Stoch length</label>
          <input type="number" value="3" name="stoch_length" id="" class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
        </div>
        <div>
          <label for="volume_ma">Volume MA (only used when source is Volume MA)</label>
          <input type="text" value="20" name="volume_ma" id="" class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
        </div>
        {% if form_error %}
        <p class="m-2 text-sm text-red-600 dark:text-red-500"><span class="font-medium">Oops! </span>{{ form_error }}</p>
        {% endif %}
        <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Submit</button>
      </form>
</section>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Get the current date in the format "YYYY-MM-DD"
    //const last_week = (new Date() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
    const today = new Date().toISOString().split('T')[0];

    // Set the default value for the date input
    //document.getElementById('startTimeInput').defaultValue = last_week;
    document.getElementById('shutdownDateInput').defaultValue = today;
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Get the current date in the format "YYYY-MM-DD"
    const now = new Date();
    const last_week = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 7).toISOString().split('T')[0];

    // Set the default value for the date input
    document.getElementById('startTimeInput').defaultValue = last_week;
  });
</script>
{% endblock %}
