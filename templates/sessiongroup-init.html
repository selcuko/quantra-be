{% extends 'base.html' %}
{% block content %}
<section class="p-4">
  <h1
    class="mb-4 text-4xl font-extrabold leading-none tracking-tight text-gray-900 md:text-5xl lg:text-6xl dark:text-white">
    Start a new
    <span class="underline underline-offset-3 decoration-8 decoration-blue-400 dark:decoration-blue-600">
      Session Group
    </span>
  </h1>
  <form method="POST" action="">
    {% csrf_token %}
    <label for="strategy">Strategy</label>
    <select id="strategy" name="strategy"
      class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      required>
      <option value="" disabled selected>Select a strategy</option>
      {% for strategy in strategies %}
      <option value="{{ strategy.code }}"> {{ strategy.name }} {{ strategy.version }} ({{ strategy.technical_name }}) </option>
      {% endfor %}
    </select>
    <label for="market">Markets (hold cmd/ctrl to select multiple)</label>
    <select id="market" name="market"
      class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      multiple required>
      <option value="" disabled selected>Select a market</option>
      {% for market in markets %}
      <option value="{{ market.id }}">[{{market.exchange}}] {{ market.owner }}</option>
      {% endfor %}
    </select>
    <div>
      <label for="symbol">Symbol</label>
      <input type="text" placeholder="Symbol (BASE-QUOTE)" name="symbol" id="symbol"
        class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
    </div>
    <div>
      <label for="type">Candle freq</label>
      <select name="freq" id="freq"
        class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
        <option value="" disabled selected>Select a frequency</option>
        <option value="1 min">1 minute</option>
        <option value="5 min">5 minute</option>
        <option value="15 min" selected>15 minute</option>
        <option value="1 hour">1 hour</option>
        <option value="4 hour">4 hours</option>
        <option value="1 day">1 day</option>
        <option value="1 week">1 week</option>
        <option value="1 month">1 month</option>
      </select>
    </div>
    <label for="kline_source">Candle source: </label>
    <div class="inline-flex rounded-md shadow-sm" role="group">
      <input type="hidden" name="kline_source" value="trade">
      <button id="trade" type="button"
        class="button px-4 py-2 text-sm font-medium border border-gray-200 rounded-s-lg focus:z-10 focus:ring-blue-700 bg-blue-500 hover:bg-blue-600 text-gray-900">
        Trade
      </button>
      <button id="websocket" type="button"
        class="button px-4 py-2 text-sm font-medium border-t border-b border-gray-200 focus:z-10">
        Websocket
      </button>
      <button id="rest" type="button"
        class="button px-4 py-2 text-sm font-medium border border-gray-200 rounded-e-lg focus:z-10">
        REST
      </button>
    </div>
    <br>
    {% if form_error %}
    <br>
    <p class="m-2 text-sm text-red-600 dark:text-red-500"><span class="font-medium">Oops! </span>{{ form_error }}</p>
    <br>
    {% endif %}
    <button type="submit"
      class="p-5 my-5 text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Submit</button>
    <br>
    <div>
      <label for="candle_type">Candle type</label>
      <select name="candle_type" id="candle_type"
        class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
        <option value="standard" selected>Standard</option>
        <option value="heikin_ashi">Heikin Ashi</option>
      </select>
    </div>
    <div>
      <label for="source">Strategy source</label>
      <select name="source" id="source"
        class="mb-6 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
        <option value="close" selected>close</option>
        <option value="ohlc4">OHLC4</option>
        <option value="volume">volume</option>
        <option value="volume_ma">volume MA</option>
      </select>
    </div>
    {% if form_error %}
    <p class="m-2 text-sm text-red-600 dark:text-red-500"><span class="font-medium">Oops! </span>{{ form_error }}</p>
    {% endif %}
    <button type="submit"
      class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Submit</button>
  </form>
</section>
<script>
  // Display current price of symbol when market is selected and symbol is input
  const marketSelect = document.getElementById('market');
  const symbolInput = document.getElementById('symbol');
  const currentPriceDiv = document.getElementById('current-price');

  // Function to fetch and display current price
  async function fetchCurrentPrice() {
    const marketId = marketSelect.value;
    const symbol = symbolInput.value;

    if (!marketId || !symbol) {
      currentPriceDiv.innerText = '';
      return;
    }

    try {
      const response = await fetch(`/price/?market=${marketId}&symbol=${symbol}`);
      const data = await response.json();
      if (response.ok) {
        if (data.price) {
          currentPriceDiv.innerText = `Current price: $ ${data.price}`;
        } else {
          currentPriceDiv.innerText = `---`;
        }
      } else {
        currentPriceDiv.innerText = `Error: ${data.message}`;
      }
    } catch (error) {
      currentPriceDiv.innerText = `Error: ${error.message}`;
    }
  }

  marketSelect.addEventListener('change', fetchCurrentPrice);
  symbolInput.addEventListener('input', fetchCurrentPrice);
</script>
<script>
  // Display market available_capital and capital when market is selected
  const marketAvailableCapital = document.getElementById('market-available-capital');

  async function fetchMarketData() {
    const marketId = marketSelect.value;

    if (!marketId) {
      marketAvailableCapital.innerText = '';
      marketEquityDiv.innerText = '';
      return;
    }
    try {
      const response = await fetch(`/market/${marketId}/raw/`);
      const data = await response.json();
      if (response.ok) {
        available_capital = data.available_capital.toFixed(2);
        capital = data.capital.toFixed(2);
        marketAvailableCapital.innerText = `Available/total capital: $ ${available_capital} ($ ${capital})`;
      } else {
        marketAvailableCapital.innerText = `Error: ${data.message}`;
      }
    } catch (error) {
      marketAvailableCapital.innerText = `Error: ${error.message}`;
    }
  }

  marketSelect.addEventListener('change', fetchMarketData);
</script>
<script>
  // Set kline source when candle source is selected (radio button behavior)
  const buttons = document.querySelectorAll('.button');
  const input = document.querySelector('input[name=kline_source]');

  buttons.forEach(button => {
    button.addEventListener('click', () => {
      buttons.forEach(btn => {
        btn.setAttribute('aria-pressed', 'false');
        btn.classList.remove('bg-blue-500');
        btn.classList.remove('hover:bg-blue-600');
        btn.classList.remove('text-gray-900');
      });
      button.setAttribute('aria-pressed', 'true');
      button.classList.add('bg-blue-500');
      button.classList.add('hover:bg-blue-600');
      button.classList.add('text-gray-900');
      input.value = button.id;
    });
  });

</script>
<script>
  // Set available_capital and asset limits when range inputs are changed (tie range and input together)
  const capitalRange = document.getElementById('capital-range');
  const assetRange = document.getElementById('asset-range');
  const capitalInput = document.getElementById('capital');
  const assetsInput = document.getElementById('assets');
  overallocationWarning = document.getElementById('overallocation-warning');


  capitalInput.addEventListener('input', () => {
    capitalRange.value = capitalInput.value;
    if (capitalInput.value > capital) {
      overallocationWarning.removeAttribute('hidden');
    } else {
      overallocationWarning.setAttribute('hidden', 'hidden');
    }
  });

  assetsInput.addEventListener('input', () => {
    assetRange.value = assetsInput.value;
  });

  capitalRange.addEventListener('input', () => {
    capitalInput.value = capitalRange.value;
  });

  assetRange.addEventListener('input', () => {
    assetsInput.value = assetRange.value;
  });
</script>


{% endblock %}
